services:
  # database for backend
  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - database_data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --eval ''rs.status().ok || rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]}).ok''',
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  #redis cache for backend

  cache:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data

  # mail service
  mail:
    image: mailhog/mailhog:latest
    ports:
      - '8025:8025'
      - '1025:1025'

volumes:
  database_data:
  redis_data:
